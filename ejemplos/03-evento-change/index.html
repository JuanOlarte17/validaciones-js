<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo: evento change (select y checkbox)</title>
</head>
<body>
    <a href="../index.html">Volver a los ejemplos</a>
    <h1>Ejemplo: evento change (select y checkbox)</h1>
    <p>
        <label for="programa">Programa</label>
        <select id="programa">
            <option value="">Seleccione un programa</option>
            <option value="ADSO">Análisis y Desarrollo de Software</option>
            <option value="Multimedia">Producción Multimedia</option>
        </select>
        <small id="errorPrograma" style="color:#dc2626"></small>
    </p>
    <p>
        <label><input type="checkbox" id="terminos"> Acepto los términos</label>
        <small id="errorTerminos" style="color:#dc2626"></small>
    </p>
    <script src="ejemplo.js"></script>
</body>
</html>
